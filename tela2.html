<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #button-procura{
            background-color: #4CAF50;
            /* cor de fundo */
            color: white;
            /* cor do texto */
            padding: 10px 20px;
            /* espaço interno */
            border: none;
            /* sem borda */
            border-radius: 8px;
            /* bordas arredondadas */
            cursor: pointer;
            /* mãozinha ao passar */
            font-size: 16px;
        }
        #numero-procura{
            /* largura da caixinha */
            padding: 8px;
            margin-right: 10px;
            margin-bottom: 5px;
            /* espaço entre os inputs */
            /* número centralizado */
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="m-5">
        <h1>Sistema de Procura</h1>
        <h3>Insira o número que deseja procurar</h3>
        <div class="mt-3">
            <input id="numero-procura" type="number" placeholder="Insira um inteiro">
        </div>
        <div class="mt-3">
            <button id="button-procura" class="btn btn-outline-secondary">Entra</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
