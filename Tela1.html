<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .numero {
            width: 90px;
            /* largura da caixinha */
            padding: 8px;
            margin-right: 10px;
            margin-bottom: 5px;
            /* espaço entre os inputs */
            text-align: center;
            /* número centralizado */
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .meu-botao {
            background-color: #4CAF50;
            /* cor de fundo */
            color: white;
            /* cor do texto */
            padding: 10px 20px;
            /* espaço interno */
            border: none;
            /* sem borda */
            border-radius: 8px;
            /* bordas arredondadas */
            cursor: pointer;
            /* mãozinha ao passar */
            font-size: 16px;
        }

        .meu-botao:hover {
            background-color: #45a049;
            /* cor quando passa o mouse */
        }
    </style>
</head>

<body>
    <div class="m-5">
        <h1>Sistema de procura</h1>
        <h2>Insira os números que devem ser cadastados, no máximo 8 números</h2>
        <h3>Coloque números inteitos</h3>
        <div class="col">
            <input id="1" class="numero" type="number"  step="1" placeholder="1ª parte">
            <input id="2" class="numero" type="number" step="1" placeholder="2ª parte">
            <input id="3" class="numero" type="number" step="1" placeholder="3ª parte">
            <input id="4" class="numero" type="number" step="1" placeholder="4ª parte">
            <input id="5" class="numero" type="number" step="1" placeholder="5ª parte">
            <input id="6" class="numero" type="number" step="1" placeholder="6ª parte">
            <input id="7" class="numero" type="number" step="1" placeholder="7ª parte">
            <input id="8" class="numero" type="number" step="1" placeholder="8ª parte">
        </div>
        <button id="entra" class="meu-botao btn btn-outline-secondary">Entra</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
