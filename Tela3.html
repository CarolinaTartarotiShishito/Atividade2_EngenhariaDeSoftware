<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela3</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .resultado{
            width: 90px;
            /* largura da caixinha */
            padding: 8px;
            margin-right: 10px;
            margin-bottom: 5px;
            /* espaço entre os inputs */
            text-align: center;
            /* número centralizado */
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .meu-botao {
            background-color: #4CAF50;
            /* cor de fundo */
            color: white;
            /* cor do texto */
            padding: 10px 20px;
            /* espaço interno */
            border: none;
            /* sem borda */
            border-radius: 8px;
            /* bordas arredondadas */
            cursor: pointer;
            /* mãozinha ao passar */
            font-size: 16px;
        }

        .meu-botao:hover {
            background-color: #45a049;
            /* cor quando passa o mouse */
        }
    </style>
</head>

<body>
    <div class="m-5" onload="exibirResultado()">
        <h1>Sistema de procura</h1>
        <h2>Resultado da Pesquisa</h2>
        <div id="resultado" class="resultado my-3"></div>
        <button id="entra" class="meu-botao btn btn-outline-secondary" href="Tela1.html">Entra</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
